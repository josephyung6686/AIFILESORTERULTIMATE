[project]
name = "database-agent"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []

[project.optional-dependencies]
# `pytest-randomly` is not optional tooling: every guard in this suite is a
# claim about behaviour, and a guard that only holds in one collection order
# is a guard that holds by accident. Order independence is checked, not hoped.
#
# RUN IT AS: python3 -m pytest tests/ -p randomly --randomly-dont-reset-seed
#
# The flag is required and the reason is not this project's fault. pytest-randomly
# reseeds every RNG advertised through the `pytest_randomly.random_seeder` entry
# point, and any `thinc` (spaCy) in the same interpreter advertises one that hands
# `numpy.random.seed` an out-of-range value. Every test then errors in setup AND
# teardown, which reads as thousands of failures and is none of them. Order
# randomisation is what this suite wants; seed resetting is what it does not.
dev = ["pytest>=8", "pytest-randomly>=3.15"]
# The deployment layer (`src/readers/`) and ONLY it. `dependencies` above stays
# empty on purpose: P5's SPEC says it "adds no third-party runtime dependency" and
# every format reader is a caller-supplied callable, so the libraries are installed
# by a deployment that chose them, never by the part that consumes their output.
# pyobjc pins are macOS-only, which is where §2.7 puts Apple Vision.
readers = [
    # BOTH PDF libraries, and the reason is in `readers/pdf_pdfium.py`: pdfium reads
    # the pages and pdfminer still parses the Info dictionary, because pdfium's
    # `FPDF_GetMetaText` answers a key it is handed and cannot enumerate one. Measured
    # over 91 real PDFs, fifteen carry a slot outside the nine standard ones --
    # `Company`, `SourceModified`, `PTEX.Fullbanner`, and on one file six
    # `MSIP_Label_*` keys, which is a Microsoft sensitivity label.
    #
    # ADDED 2026-09-04, and it is a NEW third-party dependency: pypdfium2 wraps
    # Google's pdfium and is Apache-2.0 OR BSD-3-Clause, so it carries no copyleft
    # obligation, and it ships a prebuilt binary wheel rather than a build toolchain.
    # PyMuPDF was measured beside it and is NOT here: it is AGPL-3.0 and it was also
    # the slower of the two (47.0 against 87.0 pages/s), so there was no trade.
    "pypdfium2>=5",
    "pdfminer.six>=20231228",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

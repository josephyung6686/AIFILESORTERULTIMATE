[project]
name = "database-agent"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = []
# THE PACKAGE DECLARED NO OPERATING SYSTEM AT ALL, while `cli.py` enforced two
# (`00` amendment 39: Mac and Linux laptops are the target). A person installing
# this had nothing to read before the install that said so, and an index had
# nothing to filter on. These two classifiers are the same statement as
# `cli._ESTABLISHED_PLATFORMS`, and
# `tests/test_cli_platform_table.py::test_the_package_declares_the_platforms_the_code_accepts`
# compares the two lists so neither can gain a platform on its own.
#
# `MacOS :: MacOS X` rather than the bare `MacOS` parent: `sys.platform ==
# "darwin"` is the Darwin lineage, and the classic Mac OS the parent also covers
# is not a system this build runs on. Windows is absent because it is absent from
# the code -- it is a phase of its own and an unestablished platform refuses.
classifiers = [
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# `pytest-randomly` is not optional tooling: every guard in this suite is a
# claim about behaviour, and a guard that only holds in one collection order
# is a guard that holds by accident. Order independence is checked, not hoped.
#
# RUN IT AS: python3 -m pytest tests/ -p randomly --randomly-dont-reset-seed
#
# The flag is required and the reason is not this project's fault. pytest-randomly
# reseeds every RNG advertised through the `pytest_randomly.random_seeder` entry
# point, and any `thinc` (spaCy) in the same interpreter advertises one that hands
# `numpy.random.seed` an out-of-range value. Every test then errors in setup AND
# teardown, which reads as thousands of failures and is none of them. Order
# randomisation is what this suite wants; seed resetting is what it does not.
dev = ["pytest>=8", "pytest-randomly>=3.15", "jsonschema>=4"]
# The deployment layer (`src/readers/`) and ONLY it. `dependencies` above stays
# empty on purpose: P5's SPEC says it "adds no third-party runtime dependency" and
# every format reader is a caller-supplied callable, so the libraries are installed
# by a deployment that chose them, never by the part that consumes their output.
# pyobjc pins are macOS-only, which is where §2.7 puts Apple Vision.
readers = [
    # BOTH PDF libraries, and the reason is in `readers/pdf_pdfium.py`: pdfium reads
    # the pages and pdfminer still parses the Info dictionary, because pdfium's
    # `FPDF_GetMetaText` answers a key it is handed and cannot enumerate one. Measured
    # over 91 real PDFs, fifteen carry a slot outside the nine standard ones --
    # `Company`, `SourceModified`, `PTEX.Fullbanner`, and on one file six
    # `MSIP_Label_*` keys, which is a Microsoft sensitivity label.
    #
    # ADDED 2026-09-04, and it is a NEW third-party dependency: pypdfium2 wraps
    # Google's pdfium and is Apache-2.0 OR BSD-3-Clause, so it carries no copyleft
    # obligation, and it ships a prebuilt binary wheel rather than a build toolchain.
    # PyMuPDF was measured beside it and is NOT here: it is AGPL-3.0 and it was also
    # the slower of the two (47.0 against 87.0 pages/s), so there was no trade.
    "pypdfium2>=5",
    "pdfminer.six>=20231228",
    "pyobjc-framework-Vision>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.0; sys_platform == 'darwin'",
    # R-34, 2026-09-07. FOUR OF TWELVE WERE DECLARED. `src/readers/` imports twelve
    # third-party top-level names and this list named four, so `pip install .[readers]`
    # produced a deployment that believed it was complete and could not read a `.docx`,
    # could not run the semantic recogniser, and could not reach a model. The list is
    # now checked against the imports themselves by
    # `tests/test_packaging_declares_what_the_readers_import.py`, which re-measures
    # rather than comparing against anything anybody typed here.
    #
    # `readers/docx_python_docx.py`. The `.docx` reader `readers/deployment.py` wires
    # as `read_docx`, and the module imports `docx` at file scope, so its absence is
    # already loud -- it was simply never declared.
    "python-docx>=1.1",
    # `readers/doc_cocoa.py` reads §2.9's `.doc` through AppKit rather than through
    # `subprocess`, which `test_single_egress.NETWORK_MODULES` puts out of reach of a
    # reader. AppKit and Foundation both ship in this one distribution.
    "pyobjc-framework-Cocoa>=10.0; sys_platform == 'darwin'",
    # `readers/embedding_minilm.py`, the semantic recogniser's local encoder. It
    # already refuses by name when these are missing -- `ModelUnavailable`, naming
    # both -- which is the behaviour, not the declaration.
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
]

# THE MODEL TRANSPORTS, SEPARATE FROM THE READERS ON PURPOSE. Both live under
# `src/readers/` because they are deployment choices like every other reader, and
# both are cloud SDKs. Folding them into `readers` would make the offline install --
# the one `00` §8.4 calls the mode under which nothing about any file leaves the
# device -- pull down two clients it will never open. `dependencies` stays empty
# either way, so P5's rule is untouched by the split.
models = [
    # `readers/model_anthropic.py`.
    "anthropic>=0.40",
    # `readers/model_deepseek.py`, which speaks DeepSeek through the OpenAI client.
    "openai>=1.40",
    # NAMED, NOT ADDED (`104` R-176). `httpx` is the OpenAI client's own transport
    # library and is installed with it either way; what changed is that
    # `model_deepseek` now reaches it DIRECTLY, to put one deadline over the whole
    # call through the seam the SDK offers (`OpenAI(http_client=...)`).
    # `tests/test_packaging_declares_what_the_readers_import.py` derives this list
    # from the imports themselves, so an import that is real and undeclared is a
    # failing test -- which is the rule working, not a new dependency.
    #
    # NO VERSION BOUND, deliberately: which httpx works is `openai`'s to pin, and a
    # bound typed here would be this project inventing a compatibility claim it has
    # not measured.
    "httpx",
]

# The command a person types after installing. The name is the one `cli.py` already
# gives its own `ArgumentParser`, so `--help` names the command that produced it.
[project.scripts]
database-agent = "cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# WHAT THE WHEEL SHIPS IS LEFT TO SRC-LAYOUT AUTO-DISCOVERY, AND THE EXPLICIT
# TABLE THAT STOOD HERE IS THE DEFECT (`104` NEW-2). `[tool.setuptools.packages.
# find] where = ["src"]` names PACKAGES, and naming any of them turns off the
# discovery of single-file modules along with it -- so `cli.py`, `model_facts.py`,
# `orchestrator.py` and the eight other bare modules under `src/` were absent from
# every wheel this project built, while `[project.scripts]` above pointed the
# installed command straight at one of them. Measured: 325 entries with the table
# and no `cli.py`; 336 without it, every bare module present.
#
# NOTHING IS TYPED IN ITS PLACE. A `py-modules` list would ship today's eleven and
# go quietly wrong the day a twelfth is added -- the same shape of defect one
# level down. `src/` is the layout setuptools discovers on its own, and
# `tests/test_packaging_declares_what_the_readers_import.py` builds a wheel and
# reads its contents, so a module that stops shipping is a failing test rather
# than a command that is missing on a person's machine.

# THE PROMPT TEXT IS DATA AND SHIPS WITH THE PACKAGE THAT READS IT. Nothing under
# `library/` is a module, so neither packages nor modules carry it, and without it
# an installed `database-agent` refuses every call it is configured for
# (`RatifiedTextMissing`, `llm_harness/prompt_library.py`): "this package ships no
# default prompt text, draft or otherwise". One glob, so a new template is a new
# file rather than a second edit here.
[tool.setuptools.package-data]
"*" = ["library/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The flag the comment above RUN IT AS already requires. Made the default so the
# plain command is the documented command: without it every test errors in setup
# and teardown whenever `thinc` is importable, and four agents rediscovered that
# in one night. Order randomisation stays on; only the per-test reseed is off.
addopts = "-p randomly --randomly-dont-reset-seed"
markers = [
    "assistant_gate: P0–P2 assistant CI gate",
    "injection: prompt-injection structural fixtures",
]

[project]
name = "database-agent"
version = "0.2.0"
description = "Canvas-first local file sorter: freeze destinations, then classify onto them."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
database-agent-eval = "database_agent.evaluate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["database_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
